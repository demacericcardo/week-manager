<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Manager</title>
  <style>
    /* ---------- Base layout ---------- */
    :root {
      --gap: 4px;
      --default-color: #e8eaed; /* neutral default block color */
      --radius: 6px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #fafafa;
      color: #222;
      /* Fill the viewport and lay out vertically so the grid can take the rest */
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header.page-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    header.page-header h1 {
      font-size: 1.4rem;
      margin: 0;
    }

    #reset-btn {
      padding: 8px 14px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #reset-btn:hover { background: #f0f0f0; }

    /* ---------- Schedule: one grid so headers and cells stay aligned ----------
       Column layout: [hour label] + 7 day columns.
       Row layout:    [weekday header] + 24 hour rows. */
    .schedule {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: auto repeat(7, 1fr);
      grid-template-rows: auto repeat(24, 1fr);
      gap: var(--gap);
    }

    /* Column header (weekday) */
    .weekday {
      text-align: center;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #555;
      align-self: center;
    }

    /* Row header (hour timespan), pinned to the left column */
    .hour {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      font-size: clamp(0.6rem, 1.3vh, 0.8rem);
      font-weight: 600;
      color: #555;
      white-space: nowrap;
    }

    /* Empty top-left corner where the two header axes meet */
    .corner { background: transparent; }

    /* ---------- Individual block ---------- */
    .block {
      position: relative;
      min-height: 0;              /* allow blocks to shrink to fit the viewport */
      border-radius: var(--radius);
      background: var(--default-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 4px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      user-select: none;
      overflow: hidden;
    }
    .block:active { transform: scale(0.98); }

    .block .label {
      /* Bigger and bolder, but scales with viewport height so all 24 rows fit */
      font-size: clamp(0.7rem, 1.6vh, 1.1rem);
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
      word-break: break-word;
      /* readable on any background */
      color: #1a1a1a;
      text-shadow: 0 1px 1px rgba(255,255,255,0.4);
      pointer-events: none;
    }

    /* Color picker pinned to a corner of each block */
    .block .color-input {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 16px;
      height: 16px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      opacity: 0.8;
    }
    .block .color-input:hover { opacity: 1; }
    /* Hide the native swatch chrome so it reads as a small dot */
    .block .color-input::-webkit-color-swatch-wrapper { padding: 0; }
    .block .color-input::-webkit-color-swatch { border: 1px solid rgba(0,0,0,0.25); border-radius: 50%; }
    .block .color-input::-moz-color-swatch { border: 1px solid rgba(0,0,0,0.25); border-radius: 50%; }

    /* Small responsiveness tweak for narrow screens */
    @media (max-width: 600px) {
      body { padding: 10px; }
      .weekday { font-size: 0.6rem; }
      .hour { padding-right: 4px; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>Week Manager</h1>
    <button id="reset-btn" type="button">Reset</button>
  </header>

  <!-- Single grid: weekday headers across the top, hour labels down the left,
       and 7×24 = 168 blocks filling the body. -->
  <main class="schedule" id="schedule"></main>

  <script>
    // ---------- Configuration ----------
    const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const HOURS = 24;
    const TOTAL = DAYS.length * HOURS; // 168 blocks
    const DEFAULT_COLOR = '#e8eaed';   // neutral default
    const STORAGE_KEY = 'week-manager-blocks';

    // Hour-span label for a given hour, e.g. 0 -> "00–01", 23 -> "23–00".
    function hourLabel(h) {
      const pad = n => String(n).padStart(2, '0');
      return `${pad(h)}–${pad((h + 1) % 24)}`;
    }

    // ---------- State ----------
    // blocks[i] = { name, color }, ordered row-major: index = hour * 7 + day.
    let blocks = loadState();

    function defaultState() {
      // 168 blocks with placeholder names and the neutral default color
      return Array.from({ length: TOTAL }, (_, i) => ({
        name: `Block ${i + 1}`,
        color: DEFAULT_COLOR
      }));
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        // Basic validation: must be an array of the expected length
        if (Array.isArray(saved) && saved.length === TOTAL) return saved;
      } catch (_) { /* ignore malformed data */ }
      return defaultState();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(blocks));
    }

    // ---------- Rendering ----------
    function renderSchedule() {
      const grid = document.getElementById('schedule');
      grid.innerHTML = '';

      // Top-left empty corner, then the weekday column headers.
      const corner = document.createElement('div');
      corner.className = 'corner';
      grid.appendChild(corner);
      DAYS.forEach(day => {
        const cell = document.createElement('div');
        cell.className = 'weekday';
        cell.textContent = day;
        grid.appendChild(cell);
      });

      // One row per hour: the hour-span label, then 7 day blocks.
      for (let h = 0; h < HOURS; h++) {
        const hourCell = document.createElement('div');
        hourCell.className = 'hour';
        hourCell.textContent = hourLabel(h);
        grid.appendChild(hourCell);

        for (let d = 0; d < DAYS.length; d++) {
          const index = h * DAYS.length + d;
          grid.appendChild(createBlock(index));
        }
      }
    }

    function createBlock(index) {
      const block = blocks[index];
      const el = document.createElement('div');
      el.className = 'block';
      el.style.background = block.color;

      // Name label
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = block.name;

      // Color selector — updates the block background live
      const color = document.createElement('input');
      color.type = 'color';
      color.className = 'color-input';
      color.value = toHex(block.color);
      color.title = 'Change color';
      // Stop the click from also triggering the rename handler
      color.addEventListener('click', e => e.stopPropagation());
      color.addEventListener('input', e => {
        blocks[index].color = e.target.value;
        el.style.background = e.target.value; // live update
        saveState();
      });

      // Clicking the block lets the user rename it
      el.addEventListener('click', () => renameBlock(index, label));

      el.appendChild(label);
      el.appendChild(color);
      return el;
    }

    // ---------- Interactions ----------
    function renameBlock(index, label) {
      const current = blocks[index].name;
      const next = prompt('Rename block:', current);
      // null = cancelled; empty string is allowed to be ignored
      if (next === null) return;
      const trimmed = next.trim();
      if (trimmed === '') return;
      blocks[index].name = trimmed;
      label.textContent = trimmed; // show immediately
      saveState();
    }

    // <input type="color"> requires a 7-char hex; guard against odd values.
    function toHex(color) {
      return /^#[0-9a-fA-F]{6}$/.test(color) ? color : DEFAULT_COLOR;
    }

    // ---------- Reset ----------
    document.getElementById('reset-btn').addEventListener('click', () => {
      if (!confirm('Reset all blocks to their defaults?')) return;
      blocks = defaultState();
      saveState();
      renderSchedule();
    });

    // ---------- Init ----------
    renderSchedule();
  </script>
</body>
</html>
