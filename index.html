<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Manager</title>
  <style>
    :root {
      --gap: 4px;
      --default-color: #e8eaed;
      --radius: 6px;
      --accent: #1a73e8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #fafafa;
      color: #222;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header.page-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    header.page-header h1 { font-size: 1.4rem; margin: 0; }
    .header-hint { font-size: 0.75rem; color: #888; margin-left: 8px; }

    #reset-btn {
      padding: 8px 14px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #reset-btn:hover { background: #f0f0f0; }

    /* ---------- Schedule grid ---------- */
    .schedule {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: auto repeat(7, 1fr);
      grid-template-rows: auto repeat(24, 1fr);
      gap: var(--gap);
      user-select: none;
    }

    .weekday {
      text-align: center;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #555;
      align-self: center;
    }

    .hour {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      font-size: clamp(0.6rem, 1.3vh, 0.8rem);
      font-weight: 600;
      color: #555;
      white-space: nowrap;
    }

    .corner { background: transparent; }

    /* ---------- Block ---------- */
    .block {
      position: relative;
      min-height: 0;
      border-radius: var(--radius);
      background: var(--default-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 4px;
      cursor: pointer;
      transition: background 0.15s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .block.selected {
      outline: 3px solid var(--accent);
      outline-offset: -3px;
    }
    .block .label {
      font-size: clamp(0.7rem, 1.6vh, 1.1rem);
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
      word-break: break-word;
      color: #1a1a1a;
      text-shadow: 0 1px 1px rgba(255,255,255,0.4);
      pointer-events: none;
    }

    /* ---------- Shared overlay base ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      width: min(420px, 93vw);
      box-shadow: 0 12px 36px rgba(0,0,0,0.22);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h2 { margin: 0 0 18px; font-size: 1.1rem; }

    /* ---------- Form fields ---------- */
    .field { margin-bottom: 16px; }
    .field-label {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 7px;
    }
    .field-label .lbl {
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
    }
    .field-hint { font-size: 0.72rem; color: #aaa; }

    input[type="text"] {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    input[type="text"]:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    /* ---------- Color row ---------- */
    .color-row { display: flex; align-items: center; gap: 10px; }
    .color-row input[type="color"] {
      width: 44px;
      height: 34px;
      padding: 2px;
      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .color-apply-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      color: #444;
      cursor: pointer;
    }

    /* ---------- Block types ---------- */
    .types-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 28px;
    }
    .types-empty { font-size: 0.82rem; color: #bbb; font-style: italic; }

    .type-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 4px 6px 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      border: 2px solid transparent;
      transition: opacity 0.1s, border-color 0.1s;
    }
    .type-chip:hover { opacity: 0.85; }
    .type-chip.active { border-color: rgba(0,0,0,0.35); }

    .type-chip-del {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      opacity: 0.55;
      padding: 0 2px;
      font-family: inherit;
    }
    .type-chip-del:hover { opacity: 1; }

    .save-type-btn {
      width: 100%;
      background: transparent;
      border: 1px dashed #bbb;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.82rem;
      color: #666;
      cursor: pointer;
      font-family: inherit;
      margin-top: 10px;
    }
    .save-type-btn:hover { background: #f7f7f7; border-color: #888; }

    .divider { height: 1px; background: #eee; margin: 14px 0; }

    /* ---------- Modal actions ---------- */
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    .modal-actions button {
      padding: 9px 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      font-family: inherit;
    }
    .modal-actions button:hover { background: #f5f5f5; }
    .btn-primary { background: var(--accent) !important; color: #fff !important; border-color: var(--accent) !important; }
    .btn-primary:hover { opacity: 0.9; background: var(--accent) !important; }
    .btn-danger { background: #d93025 !important; color: #fff !important; border-color: #d93025 !important; }
    .btn-danger:hover { opacity: 0.9; background: #d93025 !important; }

    /* ---------- Confirm modal ---------- */
    .confirm-modal { width: min(320px, 93vw); }
    .confirm-modal p { margin: 0 0 22px; font-size: 0.95rem; line-height: 1.5; color: #333; }

    /* ---------- Action bar ---------- */
    .action-bar {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      color: #fff;
      border-radius: 999px;
      padding: 8px 10px 8px 18px;
      display: none;
      gap: 10px;
      align-items: center;
      box-shadow: 0 6px 24px rgba(0,0,0,0.32);
      z-index: 40;
      white-space: nowrap;
    }
    .action-bar.open { display: flex; }
    .action-bar .count { font-size: 0.85rem; font-weight: 600; }
    .ab-btn {
      background: #fff;
      color: #1a1a1a;
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
    }
    .ab-btn:hover { background: #eee; }
    .clear-btn {
      background: transparent;
      color: rgba(255,255,255,0.75);
      border: none;
      padding: 7px 6px;
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: underline;
      font-family: inherit;
    }
    .clear-btn:hover { color: #fff; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .weekday { font-size: 0.6rem; }
      .hour { padding-right: 4px; }
      .header-hint { display: none; }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <h1>Week Manager
      <span class="header-hint">Click to edit · drag to select · Shift+drag to toggle-add</span>
    </h1>
    <button id="reset-btn" type="button">Reset</button>
  </header>

  <main class="schedule" id="schedule"></main>

  <!-- ===== Edit modal ===== -->
  <div class="overlay" id="edit-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Edit block</h2>

      <!-- Saved block types -->
      <div class="field">
        <div class="field-label">
          <span class="lbl">Block types</span>
          <span class="field-hint">click to apply</span>
        </div>
        <div class="types-list" id="types-list"></div>
        <button type="button" class="save-type-btn" id="save-as-type-btn">+ Save current name &amp; color as new type</button>
      </div>

      <div class="divider"></div>

      <!-- Name -->
      <div class="field">
        <div class="field-label"><span class="lbl">Name</span></div>
        <input type="text" id="modal-name" autocomplete="off" />
      </div>

      <!-- Color -->
      <div class="field">
        <div class="field-label"><span class="lbl">Color</span></div>
        <div class="color-row">
          <input type="color" id="modal-color" />
          <label class="color-apply-label" for="modal-color-apply">
            <input type="checkbox" id="modal-color-apply" />
            Apply color
          </label>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" id="modal-cancel">Cancel</button>
        <button type="button" id="modal-save" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- ===== Confirm modal ===== -->
  <div class="overlay" id="confirm-overlay">
    <div class="modal confirm-modal" role="alertdialog" aria-modal="true">
      <p id="confirm-message"></p>
      <div class="modal-actions">
        <button type="button" id="confirm-cancel">Cancel</button>
        <button type="button" id="confirm-ok" class="btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <!-- ===== Action bar ===== -->
  <div class="action-bar" id="action-bar">
    <span class="count" id="action-count"></span>
    <button type="button" class="ab-btn" id="action-edit">Edit name / color</button>
    <button type="button" class="clear-btn" id="action-clear">Clear</button>
  </div>

  <script>
    // ===== Constants =====
    const DAYS  = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    const HOURS = 24;
    const COLS  = DAYS.length;
    const TOTAL = COLS * HOURS; // 168
    const DEFAULT_COLOR  = '#e8eaed';
    const BLOCKS_KEY = 'week-manager-blocks';
    const TYPES_KEY  = 'week-manager-types';

    const pad = n => String(n).padStart(2, '0');
    const hourLabel = h => `${pad(h)}:00`;

    // ===== Persistent state =====
    let blocks = loadBlocks();
    let blockTypes = loadTypes();

    function loadBlocks() {
      try {
        const s = JSON.parse(localStorage.getItem(BLOCKS_KEY));
        if (Array.isArray(s) && s.length === TOTAL) return s;
      } catch (_) {}
      return defaultBlocks();
    }
    function defaultBlocks() {
      return Array.from({ length: TOTAL }, (_, i) => ({ name: `Block ${i+1}`, color: DEFAULT_COLOR }));
    }
    function loadTypes() {
      try {
        const s = JSON.parse(localStorage.getItem(TYPES_KEY));
        if (Array.isArray(s)) return s;
      } catch (_) {}
      return [];
    }
    function saveBlocks() { localStorage.setItem(BLOCKS_KEY, JSON.stringify(blocks)); }
    function saveTypes()  { localStorage.setItem(TYPES_KEY,  JSON.stringify(blockTypes)); }

    // ===== Selection state =====
    const selection  = new Set(); // current selected indices
    let isDragging   = false;
    let didMove      = false;     // did the pointer enter a different cell?
    let dragStart    = null;      // { row, col }
    let isShiftDrag  = false;
    let selectionBase = new Set(); // snapshot of selection when shift-drag started

    // ===== Grid rendering =====
    function renderSchedule() {
      const grid = document.getElementById('schedule');
      grid.innerHTML = '';

      // Top-left corner + weekday headers
      grid.appendChild(el('div', 'corner'));
      DAYS.forEach(d => grid.appendChild(el('div', 'weekday', d)));

      // Hour rows
      for (let h = 0; h < HOURS; h++) {
        grid.appendChild(el('div', 'hour', hourLabel(h)));
        for (let d = 0; d < COLS; d++) grid.appendChild(createBlockEl(h * COLS + d, h, d));
      }
      syncHighlight();
    }

    function el(tag, cls, text = '') {
      const e = document.createElement(tag);
      e.className = cls;
      if (text) e.textContent = text;
      return e;
    }

    function createBlockEl(index, row, col) {
      const data = blocks[index];
      const div  = document.createElement('div');
      div.className = 'block';
      div.style.background = data.color;
      div.dataset.index = index;

      const lbl = document.createElement('span');
      lbl.className = 'label';
      lbl.textContent = data.name;
      div.appendChild(lbl);

      div.addEventListener('pointerdown', e => {
        e.preventDefault();
        isDragging  = true;
        didMove     = false;
        isShiftDrag = e.shiftKey;
        dragStart   = { row, col };

        if (isShiftDrag) {
          selectionBase = new Set(selection);
          applyToggleRect(dragStart, dragStart);
        } else {
          selection.clear();
          selection.add(index);
          syncHighlight();
        }
      });

      div.addEventListener('pointerenter', () => {
        if (!isDragging) return;
        if (row !== dragStart.row || col !== dragStart.col) didMove = true;
        if (isShiftDrag) {
          applyToggleRect(dragStart, { row, col });
        } else {
          setSelectionRect(dragStart, { row, col });
        }
      });

      return div;
    }

    // ===== Selection logic =====

    // Replace selection with the bounding rectangle of two cells
    function setSelectionRect(a, b) {
      const r1 = Math.min(a.row, b.row), r2 = Math.max(a.row, b.row);
      const c1 = Math.min(a.col, b.col), c2 = Math.max(a.col, b.col);
      selection.clear();
      for (let r = r1; r <= r2; r++)
        for (let c = c1; c <= c2; c++)
          selection.add(r * COLS + c);
      syncHighlight();
    }

    // Shift-drag: start from selectionBase and toggle every cell in the rect.
    // Cells outside the rect are restored to their base state.
    function applyToggleRect(a, b) {
      const r1 = Math.min(a.row, b.row), r2 = Math.max(a.row, b.row);
      const c1 = Math.min(a.col, b.col), c2 = Math.max(a.col, b.col);

      selection.clear();
      selectionBase.forEach(i => selection.add(i)); // restore base outside rect

      for (let r = r1; r <= r2; r++) {
        for (let c = c1; c <= c2; c++) {
          const idx = r * COLS + c;
          if (selectionBase.has(idx)) selection.delete(idx); // was selected → off
          else                        selection.add(idx);    // was not → on
        }
      }
      syncHighlight();
    }

    function syncHighlight() {
      document.querySelectorAll('.block').forEach(e =>
        e.classList.toggle('selected', selection.has(+e.dataset.index))
      );
    }

    function clearSelection() {
      selection.clear();
      syncHighlight();
      updateActionBar();
    }

    function updateActionBar() {
      const bar = document.getElementById('action-bar');
      bar.classList.toggle('open', selection.size > 0);
      document.getElementById('action-count').textContent =
        `${selection.size} block${selection.size === 1 ? '' : 's'} selected`;
    }

    // Pointer up: decide between single-click-to-edit vs keeping multi-selection
    document.addEventListener('pointerup', () => {
      if (!isDragging) return;
      isDragging = false;
      if (!isShiftDrag && !didMove && selection.size === 1) {
        openEditModal([...selection]); // simple click → go straight to edit
      } else {
        updateActionBar();
      }
    });

    // Click outside everything → clear
    document.addEventListener('pointerdown', e => {
      if (!e.target.closest('.block') &&
          !e.target.closest('.action-bar') &&
          !e.target.closest('.overlay')) {
        clearSelection();
      }
    });

    // ===== Edit modal =====
    const editOverlay      = document.getElementById('edit-overlay');
    const modalName        = document.getElementById('modal-name');
    const modalColor       = document.getElementById('modal-color');
    const modalColorApply  = document.getElementById('modal-color-apply');
    let editTargets = [];

    function openEditModal(indices) {
      editTargets = indices;
      const multi = indices.length > 1;
      const first = blocks[indices[0]];

      document.getElementById('modal-title').textContent =
        multi ? `Edit ${indices.length} blocks` : 'Edit block';

      modalName.value       = multi ? '' : first.name;
      modalName.placeholder = multi ? 'Leave blank to keep each name' : '';
      modalColor.value      = toHex(first.color);
      modalColorApply.checked = !multi;

      renderTypesInModal();
      editOverlay.classList.add('open');
      modalName.focus();
      if (!multi) modalName.select();
    }

    function closeEditModal() {
      editOverlay.classList.remove('open');
      clearSelection();
    }

    function saveEditModal() {
      const name       = modalName.value.trim();
      const applyColor = modalColorApply.checked;
      const color      = modalColor.value;
      editTargets.forEach(idx => {
        if (name !== '') blocks[idx].name = name;
        if (applyColor)  blocks[idx].color = color;
      });
      saveBlocks();
      renderSchedule();
      closeEditModal();
    }

    document.getElementById('modal-save').addEventListener('click', saveEditModal);
    document.getElementById('modal-cancel').addEventListener('click', closeEditModal);
    editOverlay.addEventListener('click', e => { if (e.target === editOverlay) closeEditModal(); });
    modalColor.addEventListener('input', () => { modalColorApply.checked = true; });
    modalName.addEventListener('keydown', e => { if (e.key === 'Enter') saveEditModal(); });

    // ===== Block types =====
    function renderTypesInModal() {
      const list = document.getElementById('types-list');
      list.innerHTML = '';

      if (blockTypes.length === 0) {
        list.appendChild(Object.assign(document.createElement('span'), {
          className: 'types-empty',
          textContent: 'No types yet'
        }));
        return;
      }

      blockTypes.forEach((type, i) => {
        const chip = document.createElement('div');
        chip.className = 'type-chip';
        chip.style.background = type.color;
        chip.style.color = contrastColor(type.color);

        const nameSpan = document.createElement('span');
        nameSpan.textContent = type.name;

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'type-chip-del';
        delBtn.textContent = '×';
        delBtn.title = 'Delete type';
        delBtn.style.color = contrastColor(type.color);
        delBtn.addEventListener('click', e => {
          e.stopPropagation();
          blockTypes.splice(i, 1);
          saveTypes();
          renderTypesInModal();
        });

        // Clicking the chip populates the name + color fields
        chip.addEventListener('click', () => {
          modalName.value = type.name;
          modalColor.value = toHex(type.color);
          modalColorApply.checked = true;
          list.querySelectorAll('.type-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
        });

        chip.appendChild(nameSpan);
        chip.appendChild(delBtn);
        list.appendChild(chip);
      });
    }

    document.getElementById('save-as-type-btn').addEventListener('click', () => {
      const name  = modalName.value.trim();
      const color = modalColor.value;
      if (!name) { modalName.focus(); return; }
      if (!blockTypes.some(t => t.name === name && t.color === color)) {
        blockTypes.push({ id: String(Date.now()), name, color });
        saveTypes();
        renderTypesInModal();
      }
    });

    // ===== Confirm modal (replaces native confirm()) =====
    let confirmCb = null;

    function openConfirm(message, onConfirm) {
      document.getElementById('confirm-message').textContent = message;
      confirmCb = onConfirm;
      document.getElementById('confirm-overlay').classList.add('open');
      document.getElementById('confirm-ok').focus();
    }

    function closeConfirm() {
      document.getElementById('confirm-overlay').classList.remove('open');
      confirmCb = null;
    }

    document.getElementById('confirm-ok').addEventListener('click', () => {
      const cb = confirmCb;
      closeConfirm();
      if (cb) cb();
    });
    document.getElementById('confirm-cancel').addEventListener('click', closeConfirm);
    document.getElementById('confirm-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('confirm-overlay')) closeConfirm();
    });

    // ===== Action bar =====
    document.getElementById('action-edit').addEventListener('click', () => openEditModal([...selection]));
    document.getElementById('action-clear').addEventListener('click', clearSelection);

    // ===== Reset =====
    document.getElementById('reset-btn').addEventListener('click', () => {
      openConfirm('Reset all blocks to their defaults? This cannot be undone.', () => {
        blocks = defaultBlocks();
        saveBlocks();
        clearSelection();
        renderSchedule();
      });
    });

    // ===== Global keyboard =====
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (editOverlay.classList.contains('open')) closeEditModal();
        else if (document.getElementById('confirm-overlay').classList.contains('open')) closeConfirm();
        else clearSelection();
      }
    });

    // ===== Utilities =====
    function toHex(color) {
      return /^#[0-9a-fA-F]{6}$/.test(color) ? color : DEFAULT_COLOR;
    }

    // Return black or white, whichever contrasts better with a hex background
    function contrastColor(hex) {
      const h = toHex(hex);
      const r = parseInt(h.slice(1,3), 16);
      const g = parseInt(h.slice(3,5), 16);
      const b = parseInt(h.slice(5,7), 16);
      return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.55 ? '#1a1a1a' : '#ffffff';
    }

    // ===== Init =====
    renderSchedule();
  </script>
</body>
</html>
